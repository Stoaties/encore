apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: encore
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOU/encore.git   # <-- point at YOUR fork, not upstream Stoaties/encore
    targetRevision: main
    path: deploy/k8s/overlays/example
  destination:
    server: https://kubernetes.default.svc
    namespace: encore
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
