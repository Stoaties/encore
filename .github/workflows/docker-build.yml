---
# Build + push the Encore image to GHCR (amd64 — the Talos cluster is amd64).
name: Build image (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [feat/youtube-playlist-direct, main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/stoaties/encore:yt-direct
            ghcr.io/stoaties/encore:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
