apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: encore
  annotations:
    # /api/events is a long-lived SSE stream; default proxy timeouts would cut it off
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: encore.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: encore
                port:
                  name: http
  # tls:
  #   - hosts: [encore.example.com]
  #     secretName: encore-tls
